<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N5 คันจิ & คำศัพท์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One&family=Noto+Sans+JP&family=Noto+Serif+JP&family=Yuji+Syuku&family=Kosugi+Maru&display=swap">
<style>
:root{--bg:#f4f6f8;--fg:#1c2530;--card:#fff;--ok:#2fb344;--bad:#e5484d;--pri:#1f78c1;--mut:#6b7785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}}
:root[data-theme="dark"]{--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding:14px}
.w{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;color:var(--fg);border:1px solid #8886;background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer}
.chip{border-radius:999px;padding:7px 14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.st{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.pg{height:6px;background:#8883;border-radius:9px;overflow:hidden;margin-bottom:14px}
.pg i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.q{background:var(--card);border-radius:16px;padding:22px 12px;text-align:center;margin-bottom:12px}
.q,.ch button,.res li{font-family:var(--kf,"Klee One"),"Noto Sans Thai",system-ui,sans-serif}
.q .b{font-size:56px;line-height:1.2}
.q .m{font-size:26px}
.q .r{color:var(--mut);min-height:24px;margin-top:6px}
.ch{display:grid;gap:8px}
.ch button{text-align:left;font-size:18px;padding:14px}
.ch button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.ch button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.ch button:disabled{cursor:default}
.nx{margin-top:12px;width:100%;background:var(--pri);color:#fff;border-color:var(--pri);display:none}
.sp{display:none;margin-left:8px;padding:2px 10px;border-radius:999px}
.res{background:var(--card);border-radius:16px;padding:18px;text-align:center}
.res .n{font-size:40px;font-weight:700}
.res ul{text-align:left;padding-left:20px;color:var(--mut)}
.res button{margin:4px}
select{font:inherit;color:var(--fg);background:var(--card);border:1px solid #8886;border-radius:999px;padding:7px 12px}
</style></head><body><div class="w">
<h1>🇯🇵 N5 คันจิ & คำศัพท์</h1>
<div class="bar"><select id="ff"></select></div>
<div class="bar" id="md"></div>
<div id="app"></div>
</div>
<script>
const P=s=>s.trim().split("\n").map(l=>l.split("|"));
const K=P(`日|ひ|วัน / พระอาทิตย์
月|つき|เดือน / พระจันทร์
火|ひ|ไฟ
水|みず|น้ำ
木|き|ต้นไม้
金|かね|เงิน / ทอง
土|つち|ดิน
山|やま|ภูเขา
川|かわ|แม่น้ำ
田|た|นาข้าว
人|ひと|คน
口|くち|ปาก
目|め|ตา
手|て|มือ
足|あし|เท้า
耳|みみ|หู
男|おとこ|ผู้ชาย
女|おんな|ผู้หญิง
子|こ|เด็ก
大|おおきい|ใหญ่
小|ちいさい|เล็ก
上|うえ|ข้างบน
下|した|ข้างล่าง
中|なか|ข้างใน
外|そと|ข้างนอก
右|みぎ|ขวา
左|ひだり|ซ้าย
前|まえ|ข้างหน้า / ก่อน
後|うしろ|ข้างหลัง
学|がく|เรียน
校|こう|โรงเรียน
本|ほん|หนังสือ
雨|あめ|ฝน
空|そら|ท้องฟ้า
花|はな|ดอกไม้
車|くるま|รถ
電|でん|ไฟฟ้า
白|しろ|สีขาว
年|とし|ปี
今|いま|ตอนนี้
何|なに|อะไร
名|な|ชื่อ
高|たかい|สูง / แพง
安|やすい|ถูก
食|たべる|กิน
飲|のむ|ดื่ม
見|みる|ดู
行|いく|ไป
来|くる|มา
聞|きく|ฟัง / ถาม
読|よむ|อ่าน
書|かく|เขียน
話|はなす|พูดคุย
買|かう|ซื้อ
出|でる|ออก
入|はいる|เข้า
休|やすむ|หยุดพัก`);
const V=P(`先生|せんせい|ครู
学生|がくせい|นักศึกษา
友達|ともだち|เพื่อน
家族|かぞく|ครอบครัว
母|はは|แม่ (ของตัวเอง)
父|ちち|พ่อ (ของตัวเอง)
学校|がっこう|โรงเรียน
会社|かいしゃ|บริษัท
電車|でんしゃ|รถไฟ
駅|えき|สถานี
病院|びょういん|โรงพยาบาล
銀行|ぎんこう|ธนาคาร
図書館|としょかん|ห้องสมุด
部屋|へや|ห้อง
お茶|おちゃ|ชา
牛乳|ぎゅうにゅう|นมวัว
肉|にく|เนื้อ
魚|さかな|ปลา
野菜|やさい|ผัก
果物|くだもの|ผลไม้
時計|とけい|นาฬิกา
電話|でんわ|โทรศัพท์
天気|てんき|อากาศ
今日|きょう|วันนี้
明日|あした|พรุ่งนี้
昨日|きのう|เมื่อวาน
毎日|まいにち|ทุกวัน
来年|らいねん|ปีหน้า
朝|あさ|ตอนเช้า
夜|よる|กลางคืน
午前|ごぜん|ก่อนเที่ยง
午後|ごご|หลังเที่ยง
新しい|あたらしい|ใหม่
古い|ふるい|เก่า
忙しい|いそがしい|ยุ่ง
楽しい|たのしい|สนุก
難しい|むずかしい|ยาก
易しい|やさしい|ง่าย
暑い|あつい|ร้อน
寒い|さむい|หนาว (อากาศ)
美味しい|おいしい|อร่อย
長い|ながい|ยาว
多い|おおい|มาก
少ない|すくない|น้อย
好き|すき|ชอบ
元気|げんき|สบายดี / แข็งแรง
有名|ゆうめい|มีชื่อเสียง
綺麗|きれい|สวย / สะอาด
静か|しずか|เงียบสงบ
教える|おしえる|สอน
習う|ならう|เรียน (จากครู)
働く|はたらく|ทำงาน
歩く|あるく|เดิน
走る|はしる|วิ่ง
泳ぐ|およぐ|ว่ายน้ำ
待つ|まつ|รอ
持つ|もつ|ถือ / มี
座る|すわる|นั่ง
開ける|あける|เปิด
閉める|しめる|ปิด
会う|あう|พบ
使う|つかう|ใช้
作る|つくる|ทำ / สร้าง
寝る|ねる|นอน
起きる|おきる|ตื่น
帰る|かえる|กลับ`);
const M={
 kr:["คันจิ → คำอ่าน",K,0,1,"b"],
 km:["คันจิ → ความหมาย",K,0,2,"b"],
 vm:["คำศัพท์ → ความหมาย",V,0,2,"b"],
 mv:["ความหมาย → คำศัพท์",V,2,0,"m"]
};
let mode="kr",Q=[],i=0,sc=0,wr=[],lock=false;
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function start(list){
  const pool=M[mode][1];
  Q=list||sh(pool).slice(0,10);i=0;sc=0;wr=[];show();
}
function show(){
  if(i>=Q.length)return end();
  const [nm,pool,qi,ai,cls]=M[mode],it=Q[i],ans=it[ai];
  let o=sh(pool.filter(x=>x[ai]!==ans&&x!==it)).slice(0,3).map(x=>x[ai]);
  o=sh(o.concat(ans));lock=false;
  $("app").innerHTML=`<div class="st"><span>ข้อ ${i+1}/${Q.length}</span><span>ถูก ${sc}</span></div>
  <div class="pg"><i style="width:${i/Q.length*100}%"></i></div>
  <div class="q"><div class="${cls}">${it[qi]}</div><div class="r" id="rd"></div></div>
  <div class="ch">${o.map((t,k)=>`<button data-k="${k}">${t}</button>`).join("")}</div>
  <button class="nx" id="nx">ข้อต่อไป →</button>`;
  document.querySelectorAll(".ch button").forEach(b=>b.onclick=()=>pick(b,ans,it));
  $("nx").onclick=()=>{i++;show()};
}
function pick(b,ans,it){
  if(lock)return;lock=true;
  const ok=b.textContent===ans;
  if(ok)sc++;else wr.push(it);
  b.classList.add(ok?"ok":"bad");
  document.querySelectorAll(".ch button").forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add("ok")});
  $("rd").innerHTML=`${it[0]} 【${it[1]}】 ${it[2]} <button class="sp" style="display:inline-block" id="sp">🔊</button>`;
  $("sp").onclick=()=>say(it[1]);
  $("nx").style.display="block";
  $("nx").textContent=i+1>=Q.length?"ดูผลลัพธ์":"ข้อต่อไป →";
}
function end(){
  let bs="";
  try{const k="n5best_"+mode,b=+localStorage.getItem(k)||0;if(sc>b){localStorage.setItem(k,sc);bs=" 🏆 สถิติใหม่!"}}catch(e){}
  $("app").innerHTML=`<div class="res"><div class="n">${sc}/${Q.length}</div><div>${bs}</div>
  ${wr.length?`<p>ข้อที่ผิด</p><ul>${wr.map(x=>`<li>${x[0]} 【${x[1]}】 ${x[2]}</li>`).join("")}</ul>`:"<p>🎉 ถูกทั้งหมด!</p>"}
  <button id="a1">เล่นใหม่</button>${wr.length?'<button id="a2">ทบทวนข้อที่ผิด</button>':""}</div>`;
  $("a1").onclick=()=>start();
  if(wr.length)$("a2").onclick=()=>start(sh(wr));
}
Object.keys(M).forEach(k=>{
  const b=document.createElement("button");b.className="chip"+(k==mode?" on":"");b.textContent=M[k][0];
  b.onclick=()=>{mode=k;document.querySelectorAll("#md .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");start()};
  $("md").appendChild(b);
});
const FF=["Klee One","Noto Sans JP","Noto Serif JP","Yuji Syuku","Kosugi Maru"];
(function(){const s=document.getElementById("ff");
FF.forEach(f=>{const o=document.createElement("option");o.value=f;o.textContent="ฟอนต์: "+f;s.appendChild(o)});
let v=FF[0];try{v=localStorage.getItem("kfont")||v}catch(e){}
if(!FF.includes(v))v=FF[0];
const ap=f=>document.documentElement.style.setProperty("--kf",'"'+f+'",sans-serif');
s.value=v;ap(v);
s.onchange=()=>{ap(s.value);try{localStorage.setItem("kfont",s.value)}catch(e){}}})();
start();
</script></body></html>
