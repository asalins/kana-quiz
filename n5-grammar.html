<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N5 ไวยากรณ์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One&family=Noto+Sans+JP&family=Noto+Serif+JP&family=Yuji+Syuku&family=Kosugi+Maru&display=swap">
<style>
:root{--bg:#f4f6f8;--fg:#1c2530;--card:#fff;--ok:#2fb344;--bad:#e5484d;--pri:#1f78c1;--mut:#6b7785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}}
:root[data-theme="dark"]{--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding:14px}
.w{max-width:600px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button{font:inherit;color:var(--fg);border:1px solid #8886;background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer}
.chip{border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
select{font:inherit;color:var(--fg);background:var(--card);border:1px solid #8886;border-radius:999px;padding:7px 12px}
.st{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.pg{height:6px;background:#8883;border-radius:9px;overflow:hidden;margin-bottom:14px}
.pg i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.q{background:var(--card);border-radius:16px;padding:24px 16px;text-align:center;margin-bottom:12px}
.q .tag{display:inline-block;font-size:12px;color:var(--mut);background:#8882;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q .sent{font-size:23px;line-height:1.7;font-family:var(--kf,"Klee One"),sans-serif}
.q .sent .bl{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--pri);color:var(--pri);font-weight:700}
.q .note{color:var(--mut);font-size:15px;margin-top:12px;text-align:left;display:none}
.ch{display:grid;gap:8px}
.ch button{text-align:left;font-size:19px;padding:14px;font-family:var(--kf,"Klee One"),sans-serif}
.ch button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.ch button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.ch button:disabled{cursor:default}
.nx{margin-top:12px;width:100%;background:var(--pri);color:#fff;border-color:var(--pri);display:none}
.res{background:var(--card);border-radius:16px;padding:18px;text-align:center}
.res .n{font-size:40px;font-weight:700}
.res ul{text-align:left;padding-left:0;color:var(--mut);list-style:none}
.res li{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #8883}
.res .jp{font-family:var(--kf,"Klee One"),sans-serif;color:var(--fg);font-size:17px}
.res button{margin:4px}
</style></head><body><div class="w">
<h1>🇯🇵 N5 ไวยากรณ์ (เติมคำในช่องว่าง)</h1>
<div class="bar"><select id="ff"></select></div>
<div class="bar" id="md"></div>
<div id="app"></div>
</div>
<script>
const P=s=>s.trim().split("\n").map(l=>{const a=l.split("|");a[6]=+a[6];return a});
// cat | sentence(with ___) | choice0 | choice1 | choice2 | choice3 | answerIndex | note(thai)
const G=P(`p|私___学生です。|は|を|に|で|0|は เป็นคำช่วยแสดงหัวข้อของประโยค (topic marker)
p|明日学校___行きます。|に|を|で|と|0|に บอกจุดหมายปลายทางของการเดินทาง
p|朝ごはん___食べます。|は|を|に|で|1|を เป็นคำช่วยที่แสดงกรรมของประโยค (ตัวรับการกระทำ)
p|図書館___勉強します。|に|を|で|へ|2|で บอกสถานที่ที่เกิดการกระทำ
p|友達___映画を見ます。|と|に|を|は|0|と แปลว่า "กับ" บอกผู้ร่วมทำกิจกรรมด้วยกัน
p|駅___学校まで歩きます。|から|まで|に|で|0|から แปลว่า "จาก" บอกจุดเริ่มต้น ใช้คู่กับ まで
p|九時___十時まで授業があります。|から|まで|に|を|0|から บอกจุดเริ่มต้นของช่วงเวลา
p|これ___私の傘です。|は|が|を|に|0|は แสดงหัวข้อของประโยค
p|誰___パーティーに来ましたか。|が|は|を|に|0|が ใช้กับคำถาม "ใคร" เพื่อทำหน้าที่ประธานประโยค
p|雨___降っています。|が|を|は|に|0|"雨が降る" เป็นวลีที่ใช้ が เสมอ
p|机の上に本___三冊あります。|が|は|を|で|0|が บอกการมีอยู่ของสิ่งของ
p|日曜日___映画を見ます。|に|で|を|は|0|に บอกเวลาที่แน่นอนของเหตุการณ์
p|8時___起きます。|に|で|を|へ|0|に ใช้กับเวลานาฬิกาที่ชัดเจน
p|これ___ください。|を|に|は|が|0|を แปลว่า "ขอสิ่งนี้ด้วย"
p|お名前___何ですか。|は|が|を|に|0|は ใช้ถามหัวข้อของประโยค
p|電車___会社へ行きます。|で|に|を|へ|0|で บอกวิธี/พาหนะที่ใช้เดินทาง
p|はし___食べます。|で|に|を|と|0|で บอกอุปกรณ์หรือวิธีการที่ใช้
p|日本語___話します。|は|が|を|に|2|を เป็นกรรมของกริยา 話す (พูดภาษาญี่ปุ่น)
p|公園___散歩します。|を|に|で|へ|0|を ใช้กับกริยาที่เคลื่อนที่ผ่านพื้นที่ เช่น 歩く・散歩する
p|家___帰ります。|に|を|で|と|0|に บอกจุดหมายของการกลับ
p|会議は何時___始まりますか。|に|で|を|は|0|に บอกเวลาที่เหตุการณ์เริ่มต้น
p|先生___質問します。|に|を|で|と|0|に บอกเป้าหมายของการกระทำ (ถามใคร)
p|子供___二人います。|が|は|を|に|0|が บอกจำนวนสิ่งที่มีอยู่
p|お誕生日___プレゼントをもらいました。|に|で|を|は|0|に บอกโอกาสหรือเวลาที่ได้รับสิ่งของ
p|机の上にペン___ノートがあります。|や|と|も|は|0|や ใช้เมื่อยกตัวอย่างบางส่วน ไม่ใช่ทั้งหมด (มีอย่างอื่นด้วย)
v|すみません、ちょっと___ください。|待って|待つ|待った|待たない|0|รูป て + ください ใช้ขอร้องให้ผู้อื่นทำสิ่งใดสิ่งหนึ่ง
v|窓を___もいいですか。|開けて|開ける|開けた|開けない|0|รูป て + もいいですか ใช้ขออนุญาต
v|ここで写真を___はいけません。|撮って|撮る|撮った|撮らない|0|รูป て + はいけません ใช้ห้ามทำ
v|今、宿題を___います。|して|する|した|しない|0|รูป て + います บอกว่ากำลังทำอยู่ (ている)
v|テレビを___から、寝ます。|見て|見る|見た|見ない|0|รูป て + から ทำสิ่งนี้ก่อนแล้วค่อยทำอีกอย่าง
v|電気を___ください。|消して|消す|消した|消さない|0|รูป て + ください ใช้ขอร้อง
v|ここでタバコを___ないでください。|吸わ|吸って|吸う|吸った|0|รูป ない + でください ใช้ห้ามทำอย่างสุภาพ
v|漢字が分から___、先生に聞きました。|なくて|ないので|ないで|なかったら|0|なくて ใช้เชื่อมเหตุผลแบบธรรมดาในประโยคเดียวกัน
v|昨日映画を___。|見ました|見ます|見て|見ない|0|บอกเหตุการณ์ในอดีต (ました)
v|先週日本へ___。|行きました|行きます|行って|行かない|0|บอกเหตุการณ์ในอดีต (ました)
v|私はコーヒーが___です。|飲みたい|飲みます|飲んで|飲む|0|~たい ใช้บอกความต้องการทำสิ่งนั้น
v|友達と___に行きたいです。|遊び|遊ぶ|遊んで|遊んだ|0|ます-stem + に行きたい แปลว่า "ไปเพื่อทำ~"
v|一緒に___ませんか。|行き|行く|行った|行って|0|ます-stem + ませんか ใช้ชวนทำสิ่งใดสิ่งหนึ่ง
v|映画を___ましょう。|見|見る|見た|見て|0|ます-stem + ましょう ใช้ชวนทำอย่างสุภาพ
v|この本は___です。|面白い|面白いだ|面白くて|面白かった|0|คำคุณศัพท์ い ตามด้วย です ตรง ๆ ไม่ต้องมี だ
v|あの公園は___です。|静か|静かな|静かに|静かだ|0|คำคุณศัพท์ な ก่อน です ใช้รูปคำนามเฉย ๆ ไม่ต้องเติม な
v|昨日は___なかったです。|寒く|寒い|寒くて|寒かった|0|คำคุณศัพท์ い ปฏิเสธอดีต ตัด い ออกแล้วเติม くなかったです
v|このラーメンは___くないです。|高|高い|高く|高くて|0|ตัด い ท้ายคำคุณศัพท์ออกแล้วเติม くない
v|木村さんは___な人です。|親切|親切い|親切な|親切だ|2|คำคุณศัพท์ な ต้องมี な ก่อนคำนามที่ตามมาเสมอ
v|駅まで___歩きました。|ゆっくり|ゆっくりな|ゆっくりの|ゆっくりだ|0|คำวิเศษณ์ใช้รูปเดิม ไม่ต้องเติมอะไรต่อท้าย
v|母は料理が___です。|上手|上手い|上手な|上手だ|0|上手 เป็นคำคุณศัพท์ な ก่อน です ไม่ต้องเติม な
v|雨が___、試合は中止です。|降ったら|降って|降り|降る|0|~たら ใช้แสดงเงื่อนไข แปลว่า "ถ้า...แล้ว"
o|疲れた___、早く寝ました。|ので|から|でも|けど|0|ので ใช้เชื่อมเหตุผลแบบสุภาพ นิยมใช้เมื่อไม่ใช่คำสั่งหรือคำชวน
o|忙しい___、旅行に行けません。|から|ので|でも|し|0|から ใช้บอกเหตุผลทั่วไป ให้ความรู้สึกเป็นกันเองกว่า ので
o|雨が降っています___、傘を持って行きます。|から|ので|でも|し|0|から เชื่อมประโยคเหตุและผล
o|明日は晴れる___です。|でしょう|です|ます|だ|0|でしょう ใช้คาดเดาสิ่งที่ไม่มั่นใจ 100%
o|すみません、駅はどこ___か。|です|ます|でしょう|だ|0|ですか ใช้ถามคำถามอย่างสุภาพ
o|これは日本語___辞書です。|の|な|に|と|0|の ใช้เชื่อมคำนามสองคำ (คำขยาย + の + คำนามหลัก)
o|これは誰___傘ですか。|の|な|に|と|0|の แสดงความเป็นเจ้าของ
o|昨日、友達___手紙をもらいました。|から|より|で|に|0|から ใช้บอกแหล่งที่มาหรือผู้ให้
o|会議は3時___終わります。|までに|まで|から|に|0|までに แปลว่า "ภายใน" กำหนดเส้นตายของเวลา ต่างจาก まで ที่หมายถึงต่อเนื่องไปจนถึง
o|頭が痛い___、薬を飲みました。|ので|でも|とき|し|0|ので ใช้เชื่อมเหตุผลอย่างสุภาพ
o|日本に___とき、富士山を見ました。|行った|行く|行って|行き|0|รูปอดีต + とき ใช้กับเหตุการณ์ที่เกิดขึ้นแล้วก่อนอีกเหตุการณ์
o|テレビを見る___、電気を消してください。|前に|後で|とき|ながら|0|前に แปลว่า "ก่อนที่จะ" ให้ทำอีกอย่างก่อน
o|音楽を聞き___、勉強します。|ながら|ながらに|ながらで|ながらの|0|~ながら ใช้บอกการทำสองอย่างพร้อมกัน
o|すみません、ちょっと___。|お願いします|お願い|お願いだ|お願いの|0|お願いします ใช้พูดขอความช่วยเหลืออย่างสุภาพ
o|これは何___作りますか。|で|に|と|の|0|で ใช้ถามถึงวัสดุหรือวิธีที่ใช้ทำสิ่งของ`);
const CATS={all:"ทั้งหมด",p:"助詞 คำช่วย",v:"รูปกริยา/คุณศัพท์",o:"แบบแผนประโยค"};
const FF=["Klee One","Noto Sans JP","Noto Serif JP","Yuji Syuku","Kosugi Maru"];
let cat="all",Q=[],i=0,sc=0,wr=[],lock=false;
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pool(){return cat==="all"?G:G.filter(x=>x[0]===cat)}
function start(){Q=sh(pool()).slice(0,10);i=0;sc=0;wr=[];show()}
function show(){
  if(i>=Q.length)return end();
  const it=Q[i],ans=it[6],choices=it.slice(2,6),correctText=choices[ans];
  lock=false;
  const opts=sh(choices);
  const [a,b]=it[1].split("___");
  $("app").innerHTML=`<div class="st"><span>ข้อ ${i+1}/${Q.length}</span><span>ถูก ${sc}</span></div>
  <div class="pg"><i style="width:${i/Q.length*100}%"></i></div>
  <div class="q"><div class="tag">${CATS[it[0]]}</div><div class="sent">${a}<span class="bl">＿＿＿</span>${b}</div><div class="note" id="nt"></div></div>
  <div class="ch">${opts.map((t,k)=>`<button data-k="${k}">${t}</button>`).join("")}</div>
  <button class="nx" id="nx">ข้อต่อไป →</button>`;
  document.querySelectorAll(".ch button").forEach(b=>b.onclick=()=>pick(b,correctText,it));
  $("nx").onclick=()=>{i++;show()};
}
function pick(b,correctText,it){
  if(lock)return;lock=true;
  const ok=b.textContent===correctText;
  if(ok)sc++;else wr.push(it);
  b.classList.add(ok?"ok":"bad");
  document.querySelectorAll(".ch button").forEach(x=>{x.disabled=true;if(x.textContent===correctText)x.classList.add("ok")});
  const nt=$("nt");nt.style.display="block";nt.textContent="✅ "+it[1].replace("___",correctText)+"\n💡 "+it[7];
  nt.style.whiteSpace="pre-line";
  $("nx").style.display="block";
  $("nx").textContent=i+1>=Q.length?"ดูผลลัพธ์":"ข้อต่อไป →";
}
function end(){
  let bs="";
  try{const k="n5gbest_"+cat,b=+localStorage.getItem(k)||0;if(sc>b){localStorage.setItem(k,sc);bs=" 🏆 สถิติใหม่!"}}catch(e){}
  $("app").innerHTML=`<div class="res"><div class="n">${sc}/${Q.length}</div><div>${bs}</div>
  ${wr.length?`<p>ข้อที่ผิด</p><ul>${wr.map(x=>`<li><div class="jp">${x[1].replace("___",x[2+x[6]])}</div>${x[7]}</li>`).join("")}</ul>`:"<p>🎉 ถูกทั้งหมด!</p>"}
  <button id="a1">เล่นใหม่</button>${wr.length?'<button id="a2">ทบทวนข้อที่ผิด</button>':""}</div>`;
  $("a1").onclick=start;
  if(wr.length)$("a2").onclick=()=>{Q=sh(wr);i=0;sc=0;wr=[];show()};
}
Object.keys(CATS).forEach(k=>{
  const b=document.createElement("button");b.className="chip"+(k==cat?" on":"");b.textContent=CATS[k];
  b.onclick=()=>{cat=k;document.querySelectorAll("#md .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");start()};
  $("md").appendChild(b);
});
(function(){const s=$("ff");
FF.forEach(f=>{const o=document.createElement("option");o.value=f;o.textContent="ฟอนต์: "+f;s.appendChild(o)});
let v=FF[0];try{v=localStorage.getItem("kfont")||v}catch(e){}
if(!FF.includes(v))v=FF[0];
const ap=f=>document.documentElement.style.setProperty("--kf",'"'+f+'",sans-serif');
s.value=v;ap(v);
s.onchange=()=>{ap(s.value);try{localStorage.setItem("kfont",s.value)}catch(e){}}})();
start();
</script></body></html>
