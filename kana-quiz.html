<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกฮิรางานะ & คาตาคานะ</title>
<style>
:root{--bg:#f4f6f8;--fg:#1c2530;--card:#fff;--ok:#4cd11f;--pend:#1f78c1;--bad:#e5484d;--mut:#6b7785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}}
:root[data-theme="dark"]{--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding:14px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,.chip{font:inherit;border:1px solid #8884;background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--pend);color:#fff;border-color:var(--pend)}
.stats{display:flex;gap:14px;color:var(--mut);font-size:14px;margin:6px 0 12px;flex-wrap:wrap}
.stats b{color:var(--fg)}
.prog{height:6px;background:#8883;border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.k{background:var(--pend);border-radius:12px;padding:6px 6px 8px;text-align:center;color:#fff;transition:background .15s}
.k .c{font-size:34px;line-height:1.3}
.k input{width:100%;border:0;border-radius:6px;text-align:center;font:inherit;font-size:16px;padding:4px 0;background:#fff;color:#111;outline:none}
.k.ok{background:var(--ok)}
.k.ok input{background:#fff8;color:#333}
.k.bad{animation:sh .3s;background:var(--bad)}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.res{display:none;margin:14px 0;padding:14px;border-radius:12px;background:var(--card);text-align:center}
</style></head><body><div class="wrap">
<h1>🇯🇵 ฝึกฮิรางานะ & คาตาคานะ</h1>
<div class="bar" id="mode"></div>
<div class="bar">
<span class="chip" id="dk">+ ตัวเติม ゛゜ (dakuten)</span>
<button id="rs">🔀 เริ่มใหม่ / สลับ</button>
<button id="gv">💡 เฉลย</button>
</div>
<div class="stats"><span>เวลา <b id="tm">0:00</b></span><span>ถูก <b id="sc">0</b>/<b id="tt">0</b></span><span>ผิด <b id="er">0</b></span><span>สถิติดีสุด <b id="bt">-</b></span></div>
<div class="prog"><i id="pg"></i></div>
<div class="res" id="res"></div>
<div class="grid" id="g"></div>
<p style="color:var(--mut);font-size:13px">พิมพ์ตัวอ่านโรมาจิ เช่น ka, shi (รับ si/ti/tu/hu ด้วย) — ถูกแล้วจะเป็นสีเขียวและเลื่อนช่องถัดไปอัตโนมัติ</p>
</div>
<script>
const H="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん".split("");
const R="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n".split(" ");
const HD="がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ".split("");
const RD="ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po".split(" ");
const AL={shi:["si"],chi:["ti"],tsu:["tu"],fu:["hu"],ji:["zi","di"],zu:["du"],wo:["o"]};
const kt=s=>String.fromCharCode(s.charCodeAt(0)+0x60);
let m="h",dk=false,items=[],t0=0,tick=null,done=0,err=0;
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function best(){try{return localStorage.getItem("kbest")}catch(e){return null}}
function build(){
  let a=H.map((c,i)=>[c,R[i]]);
  if(dk)a=a.concat(HD.map((c,i)=>[c,RD[i]]));
  let o=[];
  if(m!="k")o=o.concat(a.map(x=>[x[0],x[1]]));
  if(m!="h")o=o.concat(a.map(x=>[kt(x[0]),x[1]]));
  for(let i=o.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}
  items=o;done=0;err=0;clearInterval(tick);tick=null;t0=0;
  $("tm").textContent="0:00";$("er").textContent=0;$("res").style.display="none";
  $("bt").textContent=best()?fmt(+best()):"-";
  const g=$("g");g.innerHTML="";
  items.forEach(([c,r],i)=>{
    const d=document.createElement("div");d.className="k";
    d.innerHTML='<div class="c">'+c+'</div><input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
    const inp=d.querySelector("input");
    inp.addEventListener("input",()=>chk(d,inp,r));
    g.appendChild(d);
  });
  upd();
}
function chk(d,inp,r){
  if(!tick){t0=Date.now();tick=setInterval(()=>$("tm").textContent=fmt((Date.now()-t0)/1000|0),500)}
  const v=inp.value.trim().toLowerCase();if(!v)return;
  const al=[r].concat(AL[r]||[]);
  if(al.includes(v)){good(d,inp,r,true);return}
  if(v.length>=Math.max(...al.map(x=>x.length))){
    err++;$("er").textContent=err;inp.value="";
    d.classList.remove("bad");void d.offsetWidth;d.classList.add("bad");
    setTimeout(()=>d.classList.remove("bad"),320);
  }
}
function good(d,inp,r,adv){
  d.classList.add("ok");inp.value=r;inp.disabled=true;done++;upd();
  if(adv){const n=[...document.querySelectorAll(".k:not(.ok) input")][0];if(n)n.focus()}
  if(done==items.length)finish();
}
function upd(){
  $("sc").textContent=done;$("tt").textContent=items.length;
  $("pg").style.width=(done/items.length*100)+"%";
}
function finish(){
  clearInterval(tick);tick=null;
  const s=(Date.now()-t0)/1000|0;let msg="";
  if(items.length>=46){try{const b=+localStorage.getItem("kbest");if(!b||s<b){localStorage.setItem("kbest",s);msg=" 🏆 สถิติใหม่!"}}catch(e){}}
  $("bt").textContent=best()?fmt(+best()):"-";
  const r=$("res");r.style.display="block";
  r.innerHTML="🎉 ครบแล้ว! ใช้เวลา <b>"+fmt(s)+"</b> · ผิด <b>"+err+"</b> ครั้ง"+msg;
  r.scrollIntoView({behavior:"smooth",block:"center"});
}
$("gv").onclick=()=>{
  document.querySelectorAll(".k:not(.ok)").forEach((d,i)=>{
    const idx=[...d.parentNode.children].indexOf(d);
    const inp=d.querySelector("input");inp.disabled=true;inp.value=items[idx][1];d.style.opacity=.6;
  });clearInterval(tick);tick=null;
};
$("rs").onclick=build;
$("dk").onclick=()=>{dk=!dk;$("dk").classList.toggle("on",dk);build()};
[["h","ひらがな"],["k","カタカナ"],["b","ผสมทั้งคู่"]].forEach(([k,l])=>{
  const b=document.createElement("span");b.className="chip"+(k==m?" on":"");b.textContent=l;
  b.onclick=()=>{m=k;document.querySelectorAll("#mode .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");build()};
  $("mode").appendChild(b);
});
build();
</script></body></html>
