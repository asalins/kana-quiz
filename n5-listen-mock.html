<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N5 ฟัง & จำลองสอบ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap">
<style>
:root{--bg:#f4f6f8;--fg:#1c2530;--card:#fff;--ok:#2fb344;--bad:#e5484d;--pri:#1f78c1;--mut:#6b7785}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}}
:root[data-theme="dark"]{--bg:#12161b;--fg:#e8edf2;--card:#1d242c;--mut:#93a0ad}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.w{max-width:600px;margin:0 auto}
h1{font-size:19px;margin:4px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid #8886;background:var(--card);color:var(--fg)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button{font:inherit;color:var(--fg);border:1px solid #8886;background:var(--card);border-radius:12px;padding:9px 13px;cursor:pointer}
.chip{border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.st{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.pg{height:6px;background:#8883;border-radius:9px;overflow:hidden;margin-bottom:12px}
.pg i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.q{background:var(--card);border-radius:16px;padding:20px 14px;text-align:center;margin-bottom:12px}
.q .tag{display:inline-block;font-size:12px;color:var(--mut);background:#8882;border-radius:999px;padding:2px 10px;margin-bottom:8px}
.jp{font-family:"Klee One",sans-serif}
.q .sent{font-size:21px;line-height:1.6}
.q .sent .bl{color:var(--pri);font-weight:700;border-bottom:2px solid var(--pri)}
.q .ques{font-size:17px;margin-top:8px;color:var(--mut)}
.note{color:var(--mut);font-size:14px;margin-top:10px;text-align:left;white-space:pre-line;display:none}
.spk{font-size:15px;margin-top:6px}
.ch{display:grid;gap:8px}
.ch button{text-align:left;font-size:18px;padding:13px}
.ch button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.ch button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.ch button:disabled{cursor:default}
.nx{margin-top:10px;width:100%;background:var(--pri);color:#fff;border-color:var(--pri);display:none}
.res{background:var(--card);border-radius:16px;padding:18px;text-align:center}
.res .n{font-size:38px;font-weight:700}
.res ul{text-align:left;padding-left:0;color:var(--mut);list-style:none}
.res li{margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #8883}
.timer{font-weight:700}
.timer.warn{color:var(--bad)}
.hero{background:var(--card);border-radius:16px;padding:18px;text-align:center}
</style></head><body><div class="w">
<h1>🇯🇵 N5 ฟัง & จำลองสอบ</h1>
<div class="tabs"><button id="t1" class="on">🎧 ฝึกฟัง</button><button id="t2">📝 จำลองสอบ</button></div>
<div id="app"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function speak(t,slow){try{const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=slow?0.65:0.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
// ---- data ----
const P=s=>s.trim().split("\n").map(l=>l.split("|"));
// listening: speak(JP) | question(thai) | 4 choices | answerIndex | translation(thai)
const L=P(`田中さんは毎朝七時に起きます。|田中さんは何時に起きますか。|六時|七時|八時|九時|1|คุณทานากะตื่นเจ็ดโมงเช้าทุกวัน
すみません、トイレはどこですか。あそこです。|何について話していますか。|トイレの場所|今の時間|今日の天気|電車の時間|0|ขอโทษนะครับ ห้องน้ำอยู่ที่ไหน — อยู่ตรงนั้นครับ
今日は雨ですから、傘を持って行きます。|今日の天気は何ですか。|晴れ|雨|雪|曇り|1|วันนี้ฝนตก เลยเอาร่มไปด้วย
わたしは毎日コーヒーを飲みますが、紅茶は飲みません。|毎日飲むものは何ですか。|紅茶|水|コーヒー|牛乳|2|ฉันดื่มกาแฟทุกวัน แต่ไม่ดื่มชา
山田さんは病院で働いています。|山田さんはどこで働いていますか。|銀行|学校|病院|会社|2|คุณยามาดะทำงานที่โรงพยาบาล
来週の月曜日にテストがあります。|テストはいつありますか。|今日|明日|来週の月曜日|来月|2|มีสอบวันจันทร์หน้า
すみません、この本はいくらですか。千円です。|本はいくらですか。|百円|千円|一万円|五百円|1|ขอโทษนะครับ หนังสือเล่มนี้ราคาเท่าไร — พันเยนครับ
駅から学校まで歩いて十五分です。|駅から学校まで何分かかりますか。|五分|十分|十五分|三十分|2|จากสถานีถึงโรงเรียนเดินสิบห้านาที
わたしの誕生日は八月です。|誕生日はいつですか。|七月|八月|九月|十月|1|วันเกิดของฉันคือเดือนสิงหาคม
母は今台所で料理をしています。|母は今何をしていますか。|寝ています|料理をしています|勉強しています|テレビを見ています|1|ตอนนี้แม่กำลังทำอาหารอยู่ในครัว
すみません、この電車は大阪へ行きますか。いいえ、これは京都行きです。|この電車はどこへ行きますか。|大阪|京都|東京|名古屋|1|ขอโทษนะครับ รถไฟนี้ไปโอซาก้าไหม — ไม่ครับ นี่ไปเกียวโต
わたしは兄が一人と姉が二人います。|兄弟は何人いますか。|二人|三人|四人|五人|2|ฉันมีพี่ชายหนึ่งคนและพี่สาวสองคน
今日はとても寒いですね。はい、コートを着ました。|今日の天気はどうですか。|暑い|寒い|あたたかい|涼しい|1|วันนี้หนาวมากเลยนะ — ใช่ เลยใส่เสื้อโค้ทมา
来月、家族と旅行に行きます。|いつ旅行に行きますか。|今週|来週|今月|来月|3|เดือนหน้าจะไปเที่ยวกับครอบครัว
すみません、この漢字はどう読みますか。「やま」と読みます。|この漢字はどう読みますか。|かわ|やま|うみ|そら|1|ขอโทษนะครับ คันจิตัวนี้อ่านว่าอะไร — อ่านว่า やま (yama)`).map(a=>({type:"listen",speak:a[0],ques:a[1],ch:[a[2],a[3],a[4],a[5]],ans:+a[6],trans:a[7]}));
// kanji/vocab: word | reading | meaning(thai)
const KV=P(`日|にち|วัน / พระอาทิตย์
月|つき|เดือน / พระจันทร์
山|やま|ภูเขา
川|かわ|แม่น้ำ
人|ひと|คน
大きい|おおきい|ใหญ่
小さい|ちいさい|เล็ก
上|うえ|ข้างบน
下|した|ข้างล่าง
先生|せんせい|ครู
学生|がくせい|นักศึกษา
友達|ともだち|เพื่อน
学校|がっこう|โรงเรียน
病院|びょういん|โรงพยาบาล
電車|でんしゃ|รถไฟ
駅|えき|สถานี
今日|きょう|วันนี้
明日|あした|พรุ่งนี้
毎日|まいにち|ทุกวัน
忙しい|いそがしい|ยุ่ง`).map(a=>({type:"kv",word:a[0],read:a[1],mean:a[2]}));
// grammar: sentence(___) | 4 choices | answerIndex | note(thai) | translation(thai)
const GR=P(`私___学生です。|は|を|に|で|0|は เป็นคำช่วยแสดงหัวข้อของประโยค|ฉันเป็นนักเรียน/นักศึกษา
明日学校___行きます。|に|を|で|と|0|に บอกจุดหมายปลายทางของการเดินทาง|พรุ่งนี้จะไปโรงเรียน
朝ごはん___食べます。|は|を|に|で|1|を เป็นคำช่วยแสดงกรรมของประโยค|กินอาหารเช้า
図書館___勉強します。|に|を|で|へ|2|で บอกสถานที่ที่เกิดการกระทำ|อ่านหนังสือที่ห้องสมุด
これ___それは同じ色です。|と|に|を|は|0|と ใช้เชื่อมสองสิ่งที่นำมาเปรียบเทียบ|อันนี้กับอันนั้นสีเดียวกัน
すみません、ちょっと___ください。|待って|待つ|待った|待たない|0|รูป て + ください ใช้ขอร้อง|ขอโทษนะครับ/คะ รอสักครู่
今、宿題を___います。|して|する|した|しない|0|รูป て + います กำลังทำอยู่|ตอนนี้กำลังทำการบ้านอยู่
昨日映画を___。|見ました|見ます|見て|見ない|0|เหตุการณ์ในอดีต (ました)|เมื่อวานดูหนัง
私はコーヒーが___です。|飲みたい|飲みます|飲んで|飲む|0|~たい ต้องการทำสิ่งนั้น|ฉันอยากดื่มกาแฟ
この本は___です。|面白い|面白いだ|面白くて|面白かった|0|คำคุณศัพท์い + です ไม่ต้องมี だ|หนังสือเล่มนี้น่าสนใจ
あの公園は___です。|静か|静かな|静かに|静かだ|0|คำคุณศัพท์な ก่อน です ไม่ต้องเติม な|สวนสาธารณะนั้นเงียบสงบ
忙しい___、旅行に行けません。|から|ので|でも|し|0|から บอกเหตุผลทั่วไป|เพราะยุ่ง เลยไปเที่ยวไม่ได้
明日は晴れる___です。|でしょう|です|ます|だ|0|でしょう ใช้คาดเดา|พรุ่งนี้คงจะแดดออก
これは日本語___辞書です。|の|な|に|と|0|の เชื่อมคำนามสองคำ|นี่คือพจนานุกรมภาษาญี่ปุ่น
日本に___とき、富士山を見ました。|行った|行く|行って|行き|0|รูปอดีต + とき|ตอนที่ไปญี่ปุ่น ได้เห็นภูเขาฟูจิ`).map(a=>({type:"gram",sentence:a[0],ch:[a[1],a[2],a[3],a[4]],ans:+a[5],note:a[6],trans:a[7]}));
const KVQ=KV.map(x=>({type:"kv",word:x.word,ans:x.mean,pool:KV.map(y=>y.mean).filter(m=>m!==x.mean)}));
// ---- listening tab ----
let slow=false;
function tabListen(){
  $("app").innerHTML=`<div class="bar"><span class="chip on" id="sp1">ปกติ</span><span class="chip" id="sp2">ช้า 🐢</span><button id="rs">🔀 เริ่มชุดใหม่</button></div><div id="lst"></div>`;
  $("sp1").onclick=()=>{slow=false;$("sp1").classList.add("on");$("sp2").classList.remove("on")};
  $("sp2").onclick=()=>{slow=true;$("sp2").classList.add("on");$("sp1").classList.remove("on")};
  $("rs").onclick=lstart;
  lstart();
}
let LQ=[],li=0,lsc=0;
function lstart(){LQ=sh(L).slice(0,10);li=0;lsc=0;lshow()}
function lshow(){
  if(li>=LQ.length){$("lst").innerHTML=`<div class="res"><div class="n">${lsc}/${LQ.length}</div><button id="ag">ทำใหม่</button></div>`;$("ag").onclick=lstart;return}
  const it=LQ[li],opts=sh(it.ch.map((t,k)=>[t,k===it.ans]));
  $("lst").innerHTML=`<div class="st"><span>ข้อ ${li+1}/${LQ.length}</span><span>ถูก ${lsc}</span></div>
  <div class="q"><button class="spk" id="pl">🔊 ฟังประโยค</button><div class="ques">${it.ques}</div><div class="note" id="nt"></div></div>
  <div class="ch">${opts.map(([t],k)=>`<button data-k="${k}">${t}</button>`).join("")}</div>
  <button class="nx" id="nx">ข้อต่อไป →</button>`;
  $("pl").onclick=()=>speak(it.speak,slow);
  speak(it.speak,slow);
  document.querySelectorAll(".ch button").forEach((b,k)=>b.onclick=()=>{
    if(b.disabled)return;
    const ok=opts[k][1];if(ok)lsc++;
    document.querySelectorAll(".ch button").forEach((x,j)=>{x.disabled=true;if(opts[j][1])x.classList.add("ok");else if(x===b)x.classList.add("bad")});
    const nt=$("nt");nt.style.display="block";nt.innerHTML='<span class="jp">'+it.speak+'</span><br>🇹🇭 '+it.trans;
    $("nx").style.display="block";
  });
  $("nx").onclick=()=>{li++;lshow()};
}
// ---- mock test tab ----
let MQ=[],mi=0,msc=0,mwr=[],mTimer=null,mEnd=0,mLen=20;
function tabMock(){
  $("app").innerHTML=`<div class="hero"><p>เลือกจำนวนข้อสอบจำลอง จับเวลารวม ไม่เฉลยระหว่างทำ (เหมือนสอบจริง)</p>
  <div class="bar" style="justify-content:center">
  <button data-n="15">ชุดสั้น 15 ข้อ (10 นาที)</button>
  <button data-n="40">ชุดเต็ม 40 ข้อ (25 นาที)</button>
  </div></div>`;
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{mLen=+b.dataset.n;mstart()});
}
function mstart(){
  const pool=sh([...KVQ,...GR,...L]);
  MQ=pool.slice(0,mLen);mi=0;msc=0;mwr=[];
  mEnd=Date.now()+(mLen<=15?600:1500)*1000;
  clearInterval(mTimer);mTimer=setInterval(mtick,500);
  mshow();
}
function mtick(){
  const s=Math.max(0,Math.round((mEnd-Date.now())/1000));
  const el=$("mtm");if(el){el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");el.classList.toggle("warn",s<60)}
  if(s<=0){clearInterval(mTimer);mend()}
}
function mshow(){
  if(mi>=MQ.length)return mend();
  const it=MQ[mi];
  let body="",opts=[];
  if(it.type==="kv"){
    opts=sh([it.ans,...sh(it.pool).slice(0,3)]);
    body=`<div class="tag">คำศัพท์/คันจิ</div><div class="sent jp" style="font-size:36px">${it.word}</div><div class="ques">ความหมายคืออะไร</div>`;
  }else if(it.type==="gram"){
    opts=sh(it.ch);
    const [a,b]=it.sentence.split("___");
    body=`<div class="tag">ไวยากรณ์</div><div class="sent jp">${a}<span class="bl">＿＿＿</span>${b}</div>`;
  }else{
    opts=sh(it.ch);
    body=`<div class="tag">ฟัง</div><button class="spk" id="pl">🔊 ฟังประโยค</button><div class="ques">${it.ques}</div>`;
  }
  $("app").innerHTML=`<div class="st"><span>ข้อ ${mi+1}/${MQ.length}</span><span class="timer" id="mtm">-</span></div>
  <div class="pg"><i style="width:${mi/MQ.length*100}%"></i></div>
  <div class="q">${body}</div>
  <div class="ch">${opts.map((t,k)=>`<button data-k="${k}">${t}</button>`).join("")}</div>`;
  mtick();
  if(it.type==="listen"){const p=$("pl");if(p)p.onclick=()=>speak(it.speak,false);speak(it.speak,false)}
  document.querySelectorAll(".ch button").forEach(b=>b.onclick=()=>{
    const val=b.textContent,correct=it.type==="kv"?it.ans:(it.type==="gram"?it.ch[it.ans]:it.ch[it.ans]);
    if(val===correct)msc++;else mwr.push([it,correct]);
    mi++;mshow();
  });
}
function mend(){
  clearInterval(mTimer);
  $("app").innerHTML=`<div class="res"><div class="n">${msc}/${MQ.length}</div>
  ${mwr.length?`<p>เฉลยข้อที่ผิด (${mwr.length})</p><ul>${mwr.map(([it,c])=>{
    const label=it.type==="kv"?(it.word+" → "+c):(it.type==="gram"?it.sentence.replace("___",c):(it.speak));
    const extra=it.type==="gram"?("💡 "+it.note+(it.trans?("<br>🇹🇭 "+it.trans):"")):(it.type==="listen"?("Q: "+it.ques+" → "+c+(it.trans?("<br>🇹🇭 "+it.trans):"")):"");
    return `<li><span class="jp">${label}</span>${extra?("<br>"+extra):""}</li>`;
  }).join("")}</ul>`:"<p>🎉 ถูกทั้งหมด!</p>"}
  <button id="ag">ทำชุดใหม่</button></div>`;
  $("ag").onclick=tabMock;
}
// ---- tabs ----
$("t1").onclick=()=>{$("t1").classList.add("on");$("t2").classList.remove("on");clearInterval(mTimer);tabListen()};
$("t2").onclick=()=>{$("t2").classList.add("on");$("t1").classList.remove("on");tabMock()};
tabListen();
</script></body></html>
